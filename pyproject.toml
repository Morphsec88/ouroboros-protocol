[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ouroboros-protocol"
version = "1.0.0"
description = "Zero-dependency, deterministic cyclic encoding protocol with 3-vs-1 filler recovery, LLM-safe word framing, and keyed steganography."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Morphsec88" }
]
keywords = ["encoding", "fec", "error-correction", "iot", "llm", "steganography", "obfuscation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Topic :: Communications",
    "Topic :: Security",
    "Topic :: System :: Hardware"
]

[project.urls]
Homepage = "https://github.com"
Repository = "https://github.com"

[tool.setuptools.packages.find]
include = ["ouroboros*"]

